name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires two repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
    # See https://developers.cloudflare.com/workers/wrangler/ci-cd/ for how
    # to create a scoped API token (Workers Scripts: Edit is enough).
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # wrangler.jsonc is gitignored (it holds your account-specific KV
      # namespace id) — this workflow writes it from repo config instead.
      # Set CF_KV_NAMESPACE_ID and CF_SELF_ORIGIN as repo variables
      # (Settings → Secrets and variables → Actions → Variables).
      - name: Write wrangler.jsonc
        run: |
          sed \
            -e "s#REPLACE_WITH_YOUR_KV_NAMESPACE_ID#${{ vars.CF_KV_NAMESPACE_ID }}#" \
            -e "s#https://your-worker.your-subdomain.workers.dev#${{ vars.CF_SELF_ORIGIN }}#" \
            wrangler.jsonc.example > wrangler.jsonc

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami
          npx wrangler deploy
